server.port=${PORT:8080}
server.shutdown=graceful
 
# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spring_demo}
spring.datasource.username=${DB_USER:spring_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
 
# HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=60000

 
# JPA: nilai dari env var, default update untuk development
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
 
# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
 
# Logging
logging.level.com.belajardocker=INFO
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{20} - %msg%n