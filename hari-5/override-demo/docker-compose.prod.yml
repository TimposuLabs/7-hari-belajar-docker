# PRODUCTION: dijalankan eksplisit:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# docker-compose.override.yml TIDAK ikut karena memakai -f.
services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      api:
        condition: service_healthy
    restart: always
  api:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
