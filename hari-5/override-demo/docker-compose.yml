# BASE: konfigurasi yang sama untuk semua environment.
# Development : docker compose up -d                      (base + docker-compose.override.yml otomatis)
# Production  : docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: override-demo

services:
  api:
    build: ./api
    image: override-demo-api:1.0.0
    environment:
      PORT: "3000"
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:?isi POSTGRES_DB di .env}
      DB_USER: ${POSTGRES_USER:?isi POSTGRES_USER di .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?isi POSTGRES_DB di .env}
      POSTGRES_USER: ${POSTGRES_USER:?isi POSTGRES_USER di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  backend-net:
  frontend-net:

volumes:
  pg-data:
