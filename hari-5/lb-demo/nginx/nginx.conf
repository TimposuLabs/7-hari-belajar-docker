# nginx/nginx.conf (Hari 5): nama service "api" diresolvasi ulang saat runtime,
# sehingga instance baru dari `--scale` ikut menerima request tanpa restart Nginx.
events {
    worker_connections 1024;
}

http {
    # DNS internal Docker. valid=5s: hasil lookup dipakai ulang maksimal 5 detik.
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr rt=${request_time}s';
    access_log /dev/stdout lb;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        server_name localhost;
        server_tokens off;
        default_type application/json;

        location / {
            # PENTING: alamat disimpan di VARIABEL. Hanya dengan cara ini Nginx
            # memakai `resolver` per-request. Pada blok `upstream { server api:3000; }`
            # nama hanya diresolvasi SEKALI saat Nginx start.
            set $api_upstream http://api:3000;
            proxy_pass         $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout  3s;
            proxy_read_timeout    30s;
            proxy_next_upstream         error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
