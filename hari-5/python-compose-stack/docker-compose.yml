# Stack Python: Nginx + Flask API + PostgreSQL
# Jalankan dari direktori yang berisi file ini:  docker compose up -d --build

name: python-compose-stack        # awalan nama container/network/volume

services:

  # Nginx: satu-satunya service yang dipublikasikan ke host
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"   # HOST:CONTAINER, hanya dari komputer ini
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      api:
        condition: service_healthy          # tunggu API sehat sebelum Nginx start
    restart: unless-stopped

  # API Flask: tidak ada "ports", hanya bisa dicapai dari Nginx
  api:
    build: ./api
    image: python-compose-api:1.0.0
    environment:
      PORT: "5000"
      DB_HOST: postgres                     # nama service = hostname
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?isi POSTGRES_DB di .env}
      DB_USER: ${POSTGRES_USER:?isi POSTGRES_USER di .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # image python:slim tidak punya wget/curl, jadi pakai python itu sendiri
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # PostgreSQL: tidak dipublikasikan; data di named volume
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?isi POSTGRES_DB di .env}
      POSTGRES_USER: ${POSTGRES_USER:?isi POSTGRES_USER di .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  frontend-net:
  backend-net:
    internal: true        # tidak ada akses keluar/internet dari network ini

volumes:
  pg-data:
