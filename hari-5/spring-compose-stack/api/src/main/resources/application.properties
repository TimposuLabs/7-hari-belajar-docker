# ── Server ───────────────────────────────────────────
server.port=${PORT:8080}

# ── Datasource ───────────────────────────────────────
# Semua nilai berasal dari environment variable (diisi saat docker run).
# DB_HOST, DB_NAME, DB_USER, DB_PASSWORD wajib diisi; tidak ada password default.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Connection pool (HikariCP)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
# Jika MySQL belum siap, tunggu sampai 120 detik sebelum aplikasi menyerah
spring.datasource.hikari.initialization-fail-timeout=120000

# ── JPA / Hibernate ───────────────────────────────────
# update: buat/ubah tabel otomatis. Nyaman untuk belajar;
# untuk produksi gunakan migrasi (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Matikan "open-in-view" agar tidak ada peringatan saat startup
spring.jpa.open-in-view=false

# ── Actuator ─────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Logging ──────────────────────────────────────────
logging.level.com.belajardocker=INFO
