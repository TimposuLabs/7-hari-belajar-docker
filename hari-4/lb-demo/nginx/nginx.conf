# nginx/nginx.conf (Hari 4): setiap container API didaftarkan eksplisit.
events {
    worker_connections 512;
}

http {
    # "upstream=" pada log menunjukkan IP container mana yang menjawab
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'upstream=$upstream_addr rt=${request_time}s';
    access_log /dev/stdout lb;
    error_log  /dev/stderr warn;

    upstream node_api {
        # Round-robin (default): request dibagi bergantian.
        # max_fails/fail_timeout: server yang gagal 1x dilewati selama 10 detik.
        server api-1:3000 max_fails=1 fail_timeout=10s;
        server api-2:3000 max_fails=1 fail_timeout=10s;
        server api-3:3000 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;
        server_tokens off;
        default_type application/json;

        location / {
            proxy_pass         http://node_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout  3s;
            proxy_read_timeout    30s;

            # Jika satu container gagal, coba container lain
            proxy_next_upstream         error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
