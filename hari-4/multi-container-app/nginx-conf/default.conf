upstream api_backend {
    # "api-node" adalah NAMA CONTAINER. Docker DNS meresolvasinya ke IP container.
    # Nginx me-resolve nama ini saat START, jadi container api-node harus sudah
    # terjangkau lewat network yang dipakai Nginx sebelum Nginx dijalankan.
    server api-node:3000;
}

server {
    listen 80;
    server_name localhost;
    default_type application/json;

    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    location = /health {
        proxy_pass http://api_backend/health;
    }

    location = /nginx-health {
        return 200 '{"status":"ok","service":"nginx"}';
    }

    location = / {
        return 200 '{"message":"API Gateway aktif","endpoints":["/api/products","/health"]}';
    }
}
