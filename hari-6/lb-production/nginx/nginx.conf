# nginx/nginx.conf — Hari 6 (production hardened)
#
# CATATAN PENTING: nama "api" pada blok `upstream` diresolvasi saat Nginx START atau RELOAD,
# bukan setiap request. Setelah mengubah jumlah instance (--scale), jalankan:
#   docker compose exec nginx nginx -s reload
 
events {
    worker_connections 4096;
}
 
http {
    # ── Sembunyikan versi Nginx di header ─────────────────────
    server_tokens off;
 
    # ── Rate limiting ─────────────────────────────────────────
    # Batasi 10 request/detik per IP
    # burst=20: izinkan lonjakan sampai 20 request sekaligus
    # nodelay: langsung tolak yang melebihi burst (tidak mengantri)
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
 
    # ── Log format detail ─────────────────────────────────────
    # uct = upstream connect time
    # urt = upstream response time
    log_format prod '$remote_addr [$time_local] '
                    '"$request" $status '
                    'upstream=$upstream_addr '
                    'rt=${request_time}s '
                    'uct=${upstream_connect_time}s '
                    'urt=${upstream_response_time}s';
 
    access_log /dev/stdout prod;
    error_log  /dev/stderr warn;
 
    # ── Optimasi koneksi ──────────────────────────────────────
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;
 
    upstream node_api {
        server api:3000
            # Passive health check:
            # Setelah 3 kali gagal dalam 30 detik → tandai server "down"
            # Setelah 30 detik → coba lagi (server mungkin sudah pulih)
            max_fails=3
            fail_timeout=30s;
 
        # Keepalive connection pool:
        # Nginx mempertahankan 32 koneksi persisten ke backend
        # Mengurangi overhead TCP handshake untuk setiap request
        keepalive 32;
    }
 
    server {
        listen 80;
        server_name localhost;
        server_tokens off;
 
        # ── Security headers ──────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy        "no-referrer"   always;
 
        client_max_body_size 10M;
 
        # ── Endpoint API dengan rate limiting ─────────────────
        location /api/ {
            # Terapkan rate limiting
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;   # HTTP 429 Too Many Requests
 
            proxy_pass         http://node_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
 
            proxy_connect_timeout  5s;
            proxy_read_timeout    30s;
 
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   3;
            proxy_next_upstream_timeout 15s;
        }
 
        # ── Health dan monitoring endpoints ───────────────────
        location ~ ^/(health|which) {
            proxy_pass         http://node_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
        }
 
        # ── Status Nginx — hanya dari localhost ───────────────
        location = /nginx-status {
            stub_status on;
            allow 127.0.0.1;
            deny all;
        }
 
        # ── Tolak akses ke file tersembunyi ───────────────────
        location ~ /\. { deny all; }
    }
}