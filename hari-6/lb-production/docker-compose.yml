# Stack produksi dengan load balancing (Hari 6)
# Jalankan:  docker compose up -d --build --scale api=3
# Setelah mengubah jumlah instance:  docker compose exec nginx nginx -s reload
name: lb-production

services:
 
  nginx:
    image: nginx:1.28-alpine
    container_name: nginx-lb
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      api:
        condition: service_healthy
    # Nginx bisa berjalan read-only dengan filesystem
    read_only: true
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
 
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    # TIDAK ada container_name — wajib untuk scaling
    # TIDAK ada ports — akses hanya via Nginx
    environment:
      NODE_ENV:    production
      PORT:        3000
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${POSTGRES_DB}
      DB_USER:     ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout:  5s
      retries:  3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus:   "0.5"
          memory: 256M
        reservations:
          cpus:   "0.1"
          memory:  64M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
 
  postgres:
    image: postgres:17-alpine
    container_name: postgres-lb
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - pg-lb-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
 
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true
 
volumes:
  pg-lb-data:
    driver: local